name: Generate Blog Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Blog topic (leave empty for random)'
        required: false
        default: ''

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios dotenv

      - name: Generate Blog Post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/generate-blog.js

      - name: Publish to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Blog Generator Bot"

          NEW_FILE=$(git ls-files --others --exclude-standard pages/blog-posts/ | grep '\.html$' | head -1)

          if [ -z "$NEW_FILE" ]; then
            echo "No new blog file generated — nothing to do"
            exit 0
          fi

          SLUG=$(basename "$NEW_FILE" .html)
          TITLE="${SLUG//-/ }"

          git add pages/blog-posts/ pages/blog-index.json pages/blog.html sitemap.xml
          git commit -m "blog: ${TITLE}"
          git push origin main
