name: Generate Blog Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Blog topic (leave empty for random)'
        required: false
        default: ''

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios dotenv

      - name: Generate Blog Post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/generate-blog.js

      - name: Open Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Blog Generator Bot"

          NEW_FILE=$(git ls-files --others --exclude-standard pages/blog-posts/ | grep '\.html$' | head -1)

          if [ -z "$NEW_FILE" ]; then
            echo "No new blog file generated — nothing to do"
            exit 0
          fi

          SLUG=$(basename "$NEW_FILE" .html | sed 's/^[0-9]*-//')
          TITLE="${SLUG//-/ }"
          BRANCH="draft/${SLUG}"

          git checkout -b "$BRANCH"
          git add pages/blog-posts/ pages/blog-index.json
          git commit -m "draft: ${TITLE}"
          git push origin "$BRANCH"

          cat > /tmp/pr-body.md << EOF
          ## Draft Blog Post — Ready for Review

          **Topic:** ${TITLE}
          **File:** \`${NEW_FILE}\`

          ### To publish:
          1. Open the file and read through the content
          2. Edit directly on this branch if anything needs fixing
          3. Merge this PR — the post will go live on the blog automatically
          EOF

          gh pr create \
            --title "Draft: ${TITLE}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" \
            --draft
