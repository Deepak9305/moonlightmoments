name: Generate Sitemap

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pages/**/*.html'
      - 'pages/blog-index.json'
      - 'scripts/update-sitemap.js'
  workflow_dispatch:

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap.xml
        run: node scripts/update-sitemap.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Sitemap Generator Bot"

          if git diff --quiet sitemap.xml; then
            echo "Sitemap unchanged; nothing to commit"
          else
            git add sitemap.xml
            git commit -m "chore: regenerate sitemap"
            git push origin main
          fi
