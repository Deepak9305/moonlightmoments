            100% {
                opacity: 0;
            }
        }

        #page-title {
            position: fixed;

            text-transform: uppercase;
            margin-top: 8px;

            0%,

            }

            100% {

                width: 100px;
            }

        // =============================================
        //  NOISE HELPERS (for procedural textures)
        // =============================================
        // Simple hash-based pseudo-noise for canvas textures
        function noise2D(x, y) {
            let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function fbm(x, y, octaves) {
            let val = 0, amp = 0.5, freq = 1;
            for (let i = 0; i < octaves; i++) {
                val += amp * noise2D(x * freq, y * freq);
                amp *= 0.5;
                freq *= 2.0;
            }
            return val;
        }

        // =============================================
        //  REALISTIC PROCEDURAL TEXTURE GENERATOR
        // =============================================
        function makeRealisticTexture(config) {
            const size = 512;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const ctx = c.getContext('2d');

            const { baseR, baseG, baseB, varR, varG, varB, type, bands, craters } = config;

            const imageData = ctx.createImageData(size, size);
            const d = imageData.data;

            for (let py = 0; py < size; py++) {
                for (let px = 0; px < size; px++) {
                    const idx = (py * size + px) * 4;
                    const nx = px / size;
                    const ny = py / size;

                    let n = fbm(nx * 8, ny * 8, 5);
                    let r = baseR, g = baseG, b = baseB;

                    if (type === 'rocky') {
                        // Cratered rocky surface
                        const detail = fbm(nx * 16, ny * 16, 4);
                        r = baseR + (varR * (n - 0.5) + varR * 0.3 * (detail - 0.5));
                        g = baseG + (varG * (n - 0.5) + varG * 0.3 * (detail - 0.5));
                        b = baseB + (varB * (n - 0.5) + varB * 0.3 * (detail - 0.5));
                        if (craters) {
                            const cn = fbm(nx * 30, ny * 30, 3);
                            if (cn > 0.7) {
                                r *= 0.75; g *= 0.75; b *= 0.75;
                            }
                        }
                    } else if (type === 'gaseous') {
                        // Horizontal band structure
                        const bandNoise = Math.sin(ny * Math.PI * (bands || 12)) * 0.5 + 0.5;
                        const turbulence = fbm(nx * 6 + n * 2, ny * 3, 4);
                        r = baseR + varR * (bandNoise * 0.6 + turbulence * 0.4 - 0.5);
                        g = baseG + varG * (bandNoise * 0.6 + turbulence * 0.4 - 0.5);
                        b = baseB + varB * (bandNoise * 0.6 + turbulence * 0.4 - 0.5);
                    } else if (type === 'earth') {
                        // Continents + oceans
                        const continent = fbm(nx * 5 + 0.3, ny * 5 + 0.7, 6);
                        if (continent > 0.48) {
                            // Land
                            const landDetail = fbm(nx * 20, ny * 20, 3);
                            r = 30 + 50 * landDetail;
                            g = 80 + 60 * landDetail;
                            b = 25 + 30 * landDetail;
                        } else {
                            // Ocean
                            const oceanDepth = fbm(nx * 12, ny * 12, 3);
                            r = 15 + 20 * oceanDepth;
                            g = 40 + 60 * oceanDepth;
                            b = 130 + 70 * oceanDepth;
                        }
                        // Polar ice
                        const lat = Math.abs(ny - 0.5) * 2;
                        if (lat > 0.82) {
                            const ice = (lat - 0.82) / 0.18;
                            r = r * (1 - ice) + 230 * ice;
                            g = g * (1 - ice) + 235 * ice;
                            b = b * (1 - ice) + 240 * ice;
                        }
                    } else if (type === 'ice') {
                        const swirl = fbm(nx * 4, ny * 6, 5);
                        r = baseR + varR * (swirl - 0.5);
                        g = baseG + varG * (swirl - 0.5);
                        b = baseB + varB * (swirl - 0.5);
                    } else if (type === 'venus') {
                        // Dense swirling clouds
                        const swirl1 = fbm(nx * 3 + ny * 0.5, ny * 8, 5);
                        const swirl2 = fbm(nx * 6, ny * 4 + nx * 2, 4);
                        r = baseR + varR * (swirl1 * 0.7 + swirl2 * 0.3 - 0.5);
                        g = baseG + varG * (swirl1 * 0.7 + swirl2 * 0.3 - 0.5);
                        b = baseB + varB * (swirl1 * 0.7 + swirl2 * 0.3 - 0.5);
                    }

                    d[idx] = Math.max(0, Math.min(255, r));
                    d[idx + 1] = Math.max(0, Math.min(255, g));
                    d[idx + 2] = Math.max(0, Math.min(255, b));
                    d[idx + 3] = 255;
                }
            }

            ctx.putImageData(imageData, 0, 0);
            return new THREE.CanvasTexture(c);
        }

        const planetMeshes = [];

        planetDefs.forEach((def, idx) => {

                name: def.name,
                radius: def.radius,
                inclination: def.inclination || 0
            });
        });

        // =============================================
        //  INTERSTELLAR (Famous Stars & Constellations)
        // =============================================
        const starObjects = [];
        const interstellarGroup = new THREE.Group();
        scene.add(interstellarGroup);

        function raDecToXYZ(ra, dec, radius) {
            const phi = (90 - (dec.d + dec.m / 60 + dec.s / 3600)) * (Math.PI / 180);
            const theta = (ra.h * 15 + ra.m * 0.25 + ra.s * 0.004166) * (Math.PI / 180);
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        const STAR_SPHERE_RADIUS = 3000;
        const starGeom = new THREE.SphereGeometry(6, 8, 8);

        FAMOUS_STARS.forEach(star => {
            const pos = raDecToXYZ(star.ra, star.dec, STAR_SPHERE_RADIUS);
            const mat = new THREE.MeshBasicMaterial({ color: star.color });
            const mesh = new THREE.Mesh(starGeom, mat);
            mesh.position.copy(pos);
            mesh.name = star.name;
            interstellarGroup.add(mesh);
            starObjects.push(mesh);
        });

        // Constellation Lines
        const lineMat = new THREE.LineBasicMaterial({ color: 0x4455aa, transparent: true, opacity: 0.2 });
        CONSTELLATIONS.forEach(con => {
            const points = [];
            for (let i = 0; i < con.stars.length - 1; i++) {
                const s1 = FAMOUS_STARS.find(s => s.name === con.stars[i]);
                const s2 = FAMOUS_STARS.find(s => s.name === con.stars[i + 1]);
                if (s1 && s2) {
                    points.push(raDecToXYZ(s1.ra, s1.dec, STAR_SPHERE_RADIUS));
                    points.push(raDecToXYZ(s2.ra, s2.dec, STAR_SPHERE_RADIUS));
                }
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            interstellarGroup.add(new THREE.LineSegments(geo, lineMat));
        });

        // =============================================
        //  ASTEROID BELT (between Mars & Jupiter)
        // =============================================
        (function buildAsteroidBelt() {
            const count = 3000;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 190 + Math.random() * 40; // between Mars (155) and Jupiter (250)
                const y_offset = (Math.random() - 0.5) * 6;
                positions[i * 3] = Math.cos(angle) * dist;
                positions[i * 3 + 1] = y_offset;
                positions[i * 3 + 2] = Math.sin(angle) * dist;
                sizes[i] = 0.15 + Math.random() * 0.4;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0x887766, size: 0.4, sizeAttenuation: true, transparent: true, opacity: 0.5
            });
            scene.add(new THREE.Points(geo, mat));
        })();

        // =============================================
        //  RAYCASTING & HOVER
        // =============================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const hoverMouse = new THREE.Vector2(); // Correct Vector2 for screen space
        let focusedObject = null;
        let focusLerp = 0;
        let focusedName = "";
        const hoverLabel = document.getElementById('planet-hover-label');

        canvas.addEventListener('mousemove', e => {
            hoverMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            hoverMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(hoverMouse, camera);
            const hits = raycaster.intersectObjects([...planetMeshes.map(p => p.mesh), ...starObjects]);
            if (hits.length > 0) {
                const name = hits[0].object.name;
                hoverLabel.textContent = name;
                hoverLabel.style.display = 'block';
                hoverLabel.style.left = (e.clientX + 18) + 'px';
                hoverLabel.style.top = (e.clientY - 12) + 'px';
                canvas.style.cursor = 'pointer';
            } else {
                hoverLabel.style.display = 'none';
                canvas.style.cursor = 'crosshair';
            }
        });

        canvas.addEventListener('click', e => {
            if (currentMode !== 'orbit' || compareModeActive) return; // Disable clicking planets during free fly or compare setup

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // Check Hits
            const hits = raycaster.intersectObjects([...planetMeshes.map(p => p.mesh), ...starObjects]);
            if (hits.length > 0) {
                const name = hits[0].object.name;
                const starData = FAMOUS_STARS.find(s => s.name === name);

                if (starData) {
                    showStarPanel(starData, hits[0].object);
                } else {
                    showPlanetPanel(name);
                }
            }
        });

        // =============================================
        //  COMPARISON MODE LOGIC
        // =============================================
        let compareModeActive = false;
        let compareBaseObj = null; // The object we clicked "Compare" on

        function startCompareMode() {
            compareModeActive = true;
            compareBaseObj = focusedName; // Store the first selected object's name

            // UI feedback
            document.getElementById('planet-info-panel').classList.remove('visible');
            document.getElementById('hint-bar').textContent = 'SELECT ANOTHER BODY TO COMPARE';
            document.getElementById('hint-bar').style.opacity = '1';
            document.getElementById('hint-bar').style.animation = 'none'; // Keep visible

            // Set up a one-time click listener for the second selection
            const canvasClickHandler = (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects([...planetMeshes.map(p => p.mesh), ...starObjects]);

                if (hits.length > 0) {
                    const secondName = hits[0].object.name;
                    if (secondName !== compareBaseObj) {
                        openComparisonModal(compareBaseObj, secondName);
                    } else {
                        cancelCompareMode(); // Clicked same object
                    }
                } else {
                    cancelCompareMode(); // Clicked empty space
                }
                canvas.removeEventListener('click', canvasClickHandler);
            };

            // Slight delay so the current click doesn't trigger the second selection immediately
            setTimeout(() => {
                canvas.addEventListener('click', canvasClickHandler);
            }, 50);
        }

        function cancelCompareMode() {
            compareModeActive = false;
            document.getElementById('hint-bar').style.opacity = '0';
        }

        function buildStatHTML(label, value) {
            return `<div class="planet-ui-stat"><span>${label}</span><span>${value}</span></div>`;
        }

        function getObjStats(name) {
            // Check planet
            if (PLANET_DATA[name]) {
                const d = PLANET_DATA[name];
                return {
                    name: name, type: d.type, desc: d.desc,
                    stats: [
                        { l: "Diameter", v: d.diameter },
                        { l: "Distance", v: d.distance },
                        { l: "Temperature", v: d.temp },
                        { l: "Orbit", v: d.year }
                    ]
                };
            }
            // Check star
            const sd = FAMOUS_STARS.find(s => s.name === name);
            if (sd) {
                return {
                    name: name, type: "Star", desc: sd.desc,
                    stats: [
                        { l: "Spectral Type", v: sd.type },
                        { l: "Distance", v: sd.dist },
                        { l: "Size", v: sd.size }
                    ]
                };
            }
            return null;
        }

        function openComparisonModal(name1, name2) {
            cancelCompareMode();

            const obj1 = getObjStats(name1);
            const obj2 = getObjStats(name2);

            if (!obj1 || !obj2) return;

            // Build Left Column
            let leftHTML = `<div class="planet-ui-title">${obj1.name}</div><div class="planet-ui-desc" style="margin-bottom:15px">${obj1.type}</div>`;
            obj1.stats.forEach(s => leftHTML += buildStatHTML(s.l, s.v));
            document.getElementById('comp-left').innerHTML = leftHTML;

            // Build Right Column
            let rightHTML = `<div class="planet-ui-title">${obj2.name}</div><div class="planet-ui-desc" style="margin-bottom:15px">${obj2.type}</div>`;
            obj2.stats.forEach(s => rightHTML += buildStatHTML(s.l, s.v));
            document.getElementById('comp-right').innerHTML = rightHTML;

            // Show Modal
            document.getElementById('compare-overlay').classList.add('visible');
            document.getElementById('compare-modal').classList.add('visible');
        }

        function closeCompareModal() {
            document.getElementById('compare-overlay').classList.remove('visible');
            document.getElementById('compare-modal').classList.remove('visible');
        }

        // =============================================
        //  UI PANELS
        // =============================================

        function showPlanetPanel(name) {
            focusedName = name;
            const data = PLANET_DATA[name];
            if (!data) return;

            document.getElementById('pi-name').textContent = name;
            document.getElementById('pi-desc').textContent = data.desc;

            const statsContainer = document.getElementById('pi-stats-container');
            statsContainer.innerHTML = '';
            statsContainer.innerHTML += buildStatHTML('Diameter', data.diameter);
            statsContainer.innerHTML += buildStatHTML('Distance', data.distance);
            statsContainer.innerHTML += buildStatHTML('Day Length', data.day);
            statsContainer.innerHTML += buildStatHTML('Year Length', data.year);
            statsContainer.innerHTML += buildStatHTML('Moons', data.moons);
            statsContainer.innerHTML += buildStatHTML('Temperature', data.temp);
            statsContainer.innerHTML += buildStatHTML('Type', data.type);

            document.getElementById('compare-btn').style.display = 'block';
            document.getElementById('planet-info-panel').classList.add('visible');
            focusedObject = planetMeshes.find(p => p.name === name) || null;
            focusLerp = 0;
        }

        function showStarPanel(starData, meshObj) {
            focusedName = starData.name;
            document.getElementById('pi-name').textContent = starData.name;
            document.getElementById('pi-desc').textContent = starData.desc || "A distant star visible from Earth.";

            const statsContainer = document.getElementById('pi-stats-container');
            statsContainer.innerHTML = '';
            statsContainer.innerHTML += buildStatHTML('Spectral Type', starData.type || 'Unknown');
            statsContainer.innerHTML += buildStatHTML('Distance from Earth', starData.dist || 'Unknown');
            statsContainer.innerHTML += buildStatHTML('Est. Size', starData.size || 'Unknown');

            document.getElementById('compare-btn').style.display = 'block';
            document.getElementById('planet-info-panel').classList.add('visible');

            // Wrapper to mimic planet 'mesh' structure for camera focus
            focusedObject = { mesh: meshObj, radius: 10 };
            focusLerp = 0;
        }

        function closePlanetPanel() {
            document.getElementById('planet-info-panel').classList.remove('visible');
            focusedObject = null;
        }

        // =============================================
        //  TIME SLIDER
        // =============================================
        let timeSpeed = 1.0;
        const slider = document.getElementById('time-slider');
        const speedLabel = document.getElementById('speed-label');
        slider.addEventListener('input', () => {
            timeSpeed = parseFloat(slider.value);
            speedLabel.textContent = timeSpeed.toFixed(1) + '×';
        });

        // =============================================
        //  ANIMATION
        // =============================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const speedMultiplier = timeSpeed || 1.0;
            const timeStep = 0.0008 * speedMultiplier;

            if (currentMode === 'orbit') {
                if (orbitControls) orbitControls.update();
            } else if (currentMode === 'fly') {
                if (flyControls) flyControls.update(dt);
            }

            // Sun slow rotation
            sun.rotation.y += 0.0005;

            // Planets
            planetMeshes.forEach((p, i) => {
                orbitAngles[i] += p.speed * timeStep;
                const x = Math.cos(orbitAngles[i]) * p.orbitA;
                const z = Math.sin(orbitAngles[i]) * p.orbitB;
                if (p.inclination) {
                    // Polar to Cartesian with inclination
                    p.mesh.position.set(x, Math.sin(p.inclination) * x, z);
                } else {
                    p.mesh.position.set(x, 0, z);
                }
                // Axial rotation
                p.mesh.rotation.y += 0.003;
            });

            // Earth's Moon
            if (moonMesh) {
                const earth = planetMeshes.find(p => p.name === 'Earth');
                if (earth) {
                    moonOrbitAngle += 0.008 * timeSpeed;
                    const moonDist = 12;
                    moonMesh.position.set(
                        earth.mesh.position.x + Math.cos(moonOrbitAngle) * moonDist,
                        0.5,
                        earth.mesh.position.z + Math.sin(moonOrbitAngle) * moonDist
                    );
                    moonMesh.rotation.y += 0.002;
                }
            }

            // Soft camera focus follow (Only in Orbit Mode)
            if (focusedObject && currentMode === 'orbit') {
                focusLerp = Math.min(focusLerp + 0.015, 1);
                const t = focusedObject.mesh.position;
                const r = focusedObject.radius;
                const offset = new THREE.Vector3(r * 4.5, r * 2.5, r * 4.5);

                // If it's a star (large radius implied or far away), adjust offset
                if (focusedObject.radius === 10) offset.set(40, 20, 40);

                orbitControls.target.lerp(t.clone(), focusLerp * 0.05);
                camera.position.lerp(t.clone().add(offset), focusLerp * 0.035);
            }

            composer.render();
        }

        animate();

        // =============================================
        //  RESIZE
        // =============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
