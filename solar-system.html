    <style>
        :root {
            --bg-color: #050505;
            --text-color: #E0E0E0;
            --accent: #a78bfa;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #ec4899, #8b5cf6);
            --glass: rgba(167, 139, 250, 0.08);
            --glass-border: rgba(167, 139, 250, 0.15);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* === NAV === */
        .glass-nav {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 12px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.7));
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #888;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
        }

        .support-btn {
            color: var(--accent) !important;
            border: 1px solid var(--accent);
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            text-decoration: none;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .support-btn:hover {
            background: var(--accent-gradient);
            color: white !important;
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.6);
            border-color: transparent;
            transform: translateY(-2px);
        }

        /* === CANVAS === */
        #solar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        /* === PLANET INFO PANEL === */
        #planet-info-panel {
            position: fixed;
            top: 50%;
            left: 5%;
            transform: translateY(-50%);
            width: 300px;
            background: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 20px;
            padding: 30px;
            color: white;
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #planet-info-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) translateX(10px);
        }

        .planet-ui-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .planet-ui-desc {
            font-size: 0.82rem;
            color: #aaa;
            line-height: 1.6;
        }

        .planet-ui-stat {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
            font-size: 0.82rem;
        }

        .planet-ui-stat span:first-child {
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .planet-ui-stat span:last-child {
            color: #ddd;
            font-weight: 600;
        }

        .planet-ui-close {
            margin-top: 5px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
        }

        .planet-ui-close:hover {
            background: var(--accent);
            color: white;
        }

        /* === TIME CONTROLS === */
        #time-controls {
            position: fixed;
            bottom: 30px;
            right: 40px;
            background: rgba(10, 10, 12, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 900;
        }

        #time-controls label {
            color: #aaa;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #time-slider {
            width: 140px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        #speed-label {
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }

        /* === HINT === */
        #hint-bar {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 900;
            pointer-events: none;
            animation: hintFade 8s ease forwards;
        }

        @keyframes hintFade {

            0%,
            60% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        /* === PAGE TITLE === */
        #page-title {
            position: fixed;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 900;
            pointer-events: none;
            animation: titleFade 10s ease forwards;
        }

        #page-title h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: white;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.4);
        }

        #page-title p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        @keyframes titleFade {

            0%,
            50% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        /* === RESPONSIVE NAV === */
        @media (max-width: 768px) {
            .glass-nav {
                top: 12px;
                padding: 12px 20px;
                border-radius: 20px;
                flex-wrap: wrap;
                gap: 8px;
                width: 94%;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 6px 12px;
                order: 3;
            }

            .nav-right {
                order: 2;
                margin-left: auto;
            }

            #planet-info-panel {
                width: 240px;
                padding: 20px;
            }

            #time-controls {
                bottom: 20px;
                right: 20px;
                padding: 10px 16px;
            }

            #time-slider {
                width: 100px;
            }
        }
    </style>
</head>

    <!-- CANVAS -->
    <canvas id="solar-canvas"></canvas>

    <!-- PAGE TITLE (fades out) -->
    <div id="page-title">
        <h1>The Solar System</h1>
        <p>Click any planet to explore · Drag to orbit · Scroll to zoom</p>
    </div>

    <!-- PLANET INFO PANEL -->
    <div id="planet-info-panel">
        <div class="planet-ui-title" id="pi-name">Earth</div>
        <div class="planet-ui-desc" id="pi-desc">The blue marble.</div>
        <div class="planet-ui-stat"><span>Diameter</span><span id="pi-diameter">-</span></div>
        <div class="planet-ui-stat"><span>Distance</span><span id="pi-distance">-</span></div>
        <div class="planet-ui-stat"><span>Day Length</span><span id="pi-day">-</span></div>
        <div class="planet-ui-stat"><span>Year Length</span><span id="pi-year">-</span></div>

        <button class="planet-ui-close" onclick="closePlanetPanel()">✕ Close</button>
    </div>

    <!-- TIME CONTROLS -->
    <div id="time-controls">
        <label>Speed</label>
        <input type="range" id="time-slider" min="0" max="10" step="0.1" value="1">
        <span id="speed-label">1×</span>
    </div>

    <!-- HINT -->
    <div id="hint-bar">Click a planet to learn more</div>

    <script>
        // ===================================================
        // PLANET DATA
        // ===================================================
        const PLANET_DATA = {
            Mercury: {
                desc: "The smallest and innermost planet. A cratered world of extremes — scorching days and freezing nights with no atmosphere to moderate.",
                diameter: "4,879 km",
                distance: "57.9M km from Sun",
                day: "58.6 Earth days",
                year: "88 Earth days",
                moons: "0"
            },
            Venus: {
                desc: "The hottest planet in our Solar System, shrouded in thick toxic clouds. Its surface temperature can melt lead.",
                diameter: "12,104 km",
                distance: "108.2M km from Sun",
                day: "243 Earth days",
                year: "225 Earth days",
                moons: "0"
            },
            Earth: {
                desc: "Our home — the only known planet to harbour life. A world of liquid water, plate tectonics, and a protective magnetic field.",
                diameter: "12,742 km",
                distance: "149.6M km from Sun",
                day: "24 hours",
                year: "365.25 days",
                moons: "1 (Moon)"
            },
            Mars: {
                desc: "The Red Planet. Home to Olympus Mons, the tallest volcano in the solar system, and Valles Marineris, a canyon system stretching 4,000 km.",
                diameter: "6,779 km",
                distance: "227.9M km from Sun",
                day: "24h 37m",
                year: "687 Earth days",
                moons: "2 (Phobos, Deimos)"
            },
            Jupiter: {
                desc: "The king of planets. A gas giant so massive it could fit all other planets inside it twice over. Its Great Red Spot is a storm larger than Earth.",
                diameter: "139,820 km",
                distance: "778.5M km from Sun",
                day: "9h 56m",
                year: "11.86 Earth years",
                moons: "95+"
            },
            Saturn: {
                desc: "The jewel of the Solar System. Its magnificent rings are made of ice and rock, stretching 282,000 km but only 10 m to 1 km thick.",
                diameter: "116,460 km",
                distance: "1.43B km from Sun",
                day: "10h 42m",
                year: "29.4 Earth years",
                moons: "146+"
            },
            Uranus: {
                desc: "An ice giant that rotates on its side, likely due to a massive ancient collision. Its atmospheric methane gives it a distinctive cyan hue.",
                diameter: "50,724 km",
                distance: "2.87B km from Sun",
                day: "17h 14m",
                year: "84 Earth years",
                moons: "28"
            },
            Neptune: {
                desc: "The farthest planet, a deep blue ice giant. Home to the strongest winds in the Solar System, reaching 2,100 km/h.",
                diameter: "49,244 km",
                distance: "4.5B km from Sun",
                day: "16h 6m",
                year: "164.8 Earth years",
                moons: "16"
            }
        };

        // ===================================================
        // SCENE SETUP
        // ===================================================
        const canvas = document.getElementById('solar-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
        camera.position.set(0, 120, 300);

        const controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 30;
        controls.maxDistance = 1200;

        // Bloom post-processing
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(new THREE.RenderPass(scene, camera));
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.4, 0.6, 0.85
        );
        composer.addPass(bloomPass);

        // ===================================================
        // STARFIELD
        // ===================================================
        (function buildStars() {
            const geo = new THREE.BufferGeometry();
            const count = 8000;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 12000;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true });
            scene.add(new THREE.Points(geo, mat));
        })();

        // ===================================================
        // SUN
        // ===================================================
        const sunGeo = new THREE.SphereGeometry(22, 64, 64);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff4d6 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.name = 'Sun';
        scene.add(sun);

        // Sun glow (sprite)
        const sunGlowCanvas = document.createElement('canvas');
        sunGlowCanvas.width = sunGlowCanvas.height = 256;
        const gc = sunGlowCanvas.getContext('2d');
        const g = gc.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, 'rgba(255,230,120,0.8)');
        g.addColorStop(0.4, 'rgba(255,160,60,0.3)');
        g.addColorStop(1, 'rgba(255,80,0,0)');
        gc.fillStyle = g;
        gc.fillRect(0, 0, 256, 256);
        const sunGlowTex = new THREE.CanvasTexture(sunGlowCanvas);
        const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunGlowTex, transparent: true, depthWrite: false }));
        glowSprite.scale.set(140, 140, 1);
        sun.add(glowSprite);

        // Point light from sun
        const sunLight = new THREE.PointLight(0xfff0cc, 3, 2000);
        sunLight.castShadow = true;
        sun.add(sunLight);

        scene.add(new THREE.AmbientLight(0x222244, 0.4));

        // ===================================================
        // PLANET FACTORY
        // ===================================================
        function makePlanetTexture(color1, color2, stripes = false) {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(80, 80, 0, 128, 128, 180);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            if (stripes) {
                ctx.globalAlpha = 0.15;
                for (let y = 0; y < 256; y += 18) {
                    ctx.fillStyle = y % 36 === 0 ? '#fff' : '#000';
                    ctx.fillRect(0, y, 256, 9);
                }
                ctx.globalAlpha = 1;
            }
            // Add surface noise
            for (let i = 0; i < 3000; i++) {
                ctx.fillStyle = `rgba(${Math.random() > 0.5 ? 255 : 0},${Math.random() > 0.5 ? 255 : 0},${Math.random() > 0.5 ? 255 : 0},0.03)`;
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            }
            return new THREE.CanvasTexture(c);
        }

        // [name, radius, orbitA, orbitB, speed, color1, color2, tilt, ringColor?, stripes?]
        const planetDefs = [
            ['Mercury', 2.2, 52, 48, 4.1, '#b5927e', '#8c6852', 0.03],
            ['Venus', 5.0, 78, 76, 1.6, '#e8c87a', '#d4945a', 0.05],
            ['Earth', 5.3, 110, 107, 1.0, '#4a9eff', '#2a6640', 0.41],
            ['Mars', 3.5, 150, 146, 0.53, '#c1440e', '#9b3a0e', 0.44],
            ['Jupiter', 14, 240, 228, 0.084, '#c88b5a', '#8b5e3c', 0.05, null, true],
            ['Saturn', 12, 340, 320, 0.034, '#e8d5a3', '#c4a55a', 0.47, '#c8b484'],
            ['Uranus', 8, 440, 432, 0.012, '#7de8e8', '#5cb8c8', 1.71],
            ['Neptune', 7.5, 530, 526, 0.006, '#4060d0', '#2840a0', 0.49],
        ];

        const planetMeshes = [];
        const orbitAngles = planetDefs.map(() => Math.random() * Math.PI * 2);

        planetDefs.forEach((def, idx) => {
            const [name, radius, orbitA, orbitB, speed, c1, c2, tilt, ringColor, stripes] = def;

            // Orbit line (ellipse)
            const orbitPoints = [];
            for (let i = 0; i <= 128; i++) {
                const angle = (i / 128) * Math.PI * 2;
                orbitPoints.push(new THREE.Vector3(Math.cos(angle) * orbitA, 0, Math.sin(angle) * orbitB));
            }
            const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.35 });
            scene.add(new THREE.Line(orbitGeo, orbitMat));

            // Planet mesh
            const geo = new THREE.SphereGeometry(radius, 48, 48);
            const tex = makePlanetTexture(c1, c2, stripes);
            const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0.0 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.rotation.z = tilt;
            mesh.name = name;

            // Saturn rings
            if (ringColor) {
                const ringGeo = new THREE.RingGeometry(radius * 1.4, radius * 2.4, 80);
                const ringMat = new THREE.MeshBasicMaterial({ color: ringColor, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.3;
                mesh.add(ring);
            }

            scene.add(mesh);
            planetMeshes.push({ mesh, orbitA, orbitB, speed, name });
        });

        // ===================================================
        // RAYCASTING / CLICK
        // ===================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let focusedPlanet = null;
        let focusLerp = 0;
        let focusTarget = new THREE.Vector3();
        let focusCamera = new THREE.Vector3();

        canvas.addEventListener('click', e => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(planetMeshes.map(p => p.mesh));
            if (hits.length > 0) {
                const name = hits[0].object.name;
                showPlanetPanel(name, hits[0].object.position.clone());
            }
        });

        function showPlanetPanel(name, pos) {
            const data = PLANET_DATA[name];
            if (!data) return;
            document.getElementById('pi-name').textContent = name;
            document.getElementById('pi-desc').textContent = data.desc;
            document.getElementById('pi-diameter').textContent = data.diameter;
            document.getElementById('pi-distance').textContent = data.distance;
            document.getElementById('pi-day').textContent = data.day;
            document.getElementById('pi-year').textContent = data.year;
            document.getElementById('pi-moons').textContent = data.moons;
            document.getElementById('planet-info-panel').classList.add('visible');

            // Camera focus
            const planetObj = planetMeshes.find(p => p.name === name);
            if (planetObj) {
                focusedPlanet = planetObj;
                focusLerp = 0;
            }
        }

        function closePlanetPanel() {
            document.getElementById('planet-info-panel').classList.remove('visible');
            focusedPlanet = null;
        }

        // ===================================================
        // TIME SLIDER
        // ===================================================
        let timeSpeed = 1.0;
        const slider = document.getElementById('time-slider');
        const speedLabel = document.getElementById('speed-label');
        slider.addEventListener('input', () => {
            timeSpeed = parseFloat(slider.value);
            speedLabel.textContent = timeSpeed.toFixed(1) + '×';
        });

        // ===================================================
        // ANIMATION LOOP
        // ===================================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const dt = 0.0008 * timeSpeed;
            sun.rotation.y += 0.001;

            planetMeshes.forEach((p, i) => {
                orbitAngles[i] += p.speed * dt;
                const x = Math.cos(orbitAngles[i]) * p.orbitA;
                const z = Math.sin(orbitAngles[i]) * p.orbitB;
                p.mesh.position.set(x, 0, z);
                p.mesh.rotation.y += 0.005;
            });

            // Soft camera focus follow
            if (focusedPlanet) {
                focusLerp = Math.min(focusLerp + 0.018, 1);
                const t = focusedPlanet.mesh.position;
                const radius = focusedPlanet.mesh.geometry.parameters.radius;
                const offset = new THREE.Vector3(radius * 5, radius * 3, radius * 5);
                const tgt = t.clone();
                const camPos = t.clone().add(offset);
                controls.target.lerp(tgt, focusLerp * 0.06);
                camera.position.lerp(camPos, focusLerp * 0.04);
            }

            composer.render();
        }

        animate();

        // ===================================================
        // RESIZE
        // ===================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>

</html>
